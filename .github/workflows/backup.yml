name: Daily Database Backup

on:
  schedule:
    # Every hour — cuts potential data loss to ~1h
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backups repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO || 'webuymainapp/WeBuy-backups' }}
          token: ${{ secrets.BACKUP_PAT }}
          path: backups

      - name: Install postgres client (match server v17)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          # Add the PostgreSQL PGDG repo so we can install client 17 (the
          # default Ubuntu repo only ships v16, which can't dump a v17 server).
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          # Use the v17 pg_dump (installed from PGDG) so it matches the Supabase
          # server version. The system default is v16, which refuses to dump a
          # v17 server.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          if [ ! -x "$PG_DUMP" ]; then PG_DUMP=pg_dump; fi
          "$PG_DUMP" --no-owner --no-privileges "${{ secrets.DATABASE_URL }}" > "backups/webuy_$(date +%Y%m%d).sql"

      - name: Write per-user spending summary
        run: |
          psql "${{ secrets.DATABASE_URL }}" -c \
            "\copy (select s.reg_no, s.full_name, s.role, coalesce(w.point_balance, 0) as current_balance, coalesce((select sum(amount) from wallet_transactions wt where wt.student_id = s.id and wt.kind = 'deposit'), 0) as funds_received, coalesce((select sum(-1 * amount) from wallet_transactions wt where wt.student_id = s.id and wt.kind = 'purchase'), 0) as wallet_spent, coalesce((select sum(price) from secret_purchases sp where sp.student_id = s.id), 0) as secret_spent, coalesce((select sum(-1 * amount) from wallet_transactions wt where wt.student_id = s.id and wt.kind = 'purchase'), 0) + coalesce((select sum(price) from secret_purchases sp where sp.student_id = s.id), 0) as total_spent from students s left join student_wallets w on w.student_id = s.id order by s.reg_no) TO STDOUT WITH CSV HEADER" \
            > "backups/spending_summary_$(date +%Y%m%d).csv"

      - name: Purge stale/unverified signups
        run: |
          psql "${{ secrets.DATABASE_URL }}" -c \
            "delete from pending_signups where used_at is not null or created_at < now() - interval '7 days';"

      - name: Commit and push dump
        working-directory: backups
        run: |
          git config user.name "webuymainapp-backup-bot"
          git config user.email "backup-bot@webuymainapp.local"
          git add -A
          git diff --cached --quiet || git commit -m "daily backup $(date +%Y-%m-%d)"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.BACKUP_PAT }}
